name: Bug report
description: Report incorrect SDK behavior or a protocol compatibility problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, authorization headers, private prompts, or sensitive provider error bodies.
  - type: input
    id: version
    attributes:
      label: Le Rust version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: API surface
      options: [Client configuration, Models, Chat completion, Chat stream, Tools, Structured output, FIM completion, FIM stream, Packaging or documentation]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include a minimal sanitized reproduction and the error category.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Rust version, operating system, enabled features, and relevant model capability.
    validations:
      required: true
