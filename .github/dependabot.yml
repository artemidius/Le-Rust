version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # This ref intentionally selects the compiler used for the MSRV job.
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
