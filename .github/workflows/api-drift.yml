name: Mistral API drift

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-openapi.txt
      - run: python3 -m pip install -r scripts/requirements-openapi.txt
      - run: python3 -m unittest scripts/test_check_openapi.py
      - run: python3 scripts/check-openapi.py --report openapi-drift-report.json
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mistral-openapi-drift-report
          path: openapi-drift-report.json
          if-no-files-found: error
          retention-days: 30
