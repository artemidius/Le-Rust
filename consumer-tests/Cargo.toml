[package]
name = "le-rust-package-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
futures-util = "0.3"
le-rust = { path = "../package/le-rust-package" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
